name: Appli Android

# Fabrique AllMyStats.apk à chaque changement de l'appli Android, et le met dans la publication « android »
# (le site d'AllMyStats propose ce fichier au téléchargement).
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml", "maj.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Clé de signature
        shell: bash
        env:
          CLE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$CLE" ]; then
            echo "$CLE" | base64 -d > android/cle.jks
            echo "SIGNATURE=officielle" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ANDROID_KEYSTORE absent : APK de test (signature provisoire)."
            echo "SIGNATURE=provisoire" >> "$GITHUB_ENV"
          fi
          echo "APP_VERSION=$(python3 -c 'import json;print(json.load(open("maj.json"))["version"])')" >> "$GITHUB_ENV"

      - name: Fabrication de l'APK
        shell: bash
        working-directory: android
        env:
          KEYSTORE_PASSWORD: allmystats-android
        run: gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../journal-fabrication.txt

      - name: Publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk AllMyStats.apk
          NOTES="AllMyStats ${APP_VERSION} pour Android (téléphone relié à AllMyStats sur ton PC). Signature : ${SIGNATURE}."
          gh release view android >/dev/null 2>&1 || gh release create android --title "AllMyStats pour Android" --notes "$NOTES" --latest=false
          gh release edit android --notes "$NOTES" --latest=false
          gh release upload android AllMyStats.apk journal-fabrication.txt --clobber

      - name: Journal en cas d'échec
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-journal >/dev/null 2>&1 || gh release create android-journal --title "Journal de fabrication Android" --notes "Dernier échec" --latest=false --prerelease
          gh release upload android-journal journal-fabrication.txt --clobber || true
